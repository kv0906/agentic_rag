[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid

[program:api]
directory=/app/backend
command=/app/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
autorestart=true
stdout_logfile=/tmp/api.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/tmp/api-error.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1

[program:web]
directory=/app
command=node server.js
autorestart=true
stdout_logfile=/tmp/web.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
stderr_logfile=/tmp/web-error.log
stderr_logfile_maxbytes=1MB
stderr_logfile_backups=1
